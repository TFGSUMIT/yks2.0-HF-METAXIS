<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 720 180"
     role="img"
     aria-labelledby="title description"
     data-state="idle">
  <title id="title">METAXIS product lockup</title>
  <desc id="description">Seven-bar NSQ signal mark with the METAXIS product wordmark.</desc>
  <style>
    .bar {
      fill: #3ddff5;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    [data-state="processing"] .bar {
      animation: metaxis-eqbar 2.6s ease-in-out infinite;
    }

    [data-state="processing"] .bar:nth-child(1) { animation-delay: 0s; }
    [data-state="processing"] .bar:nth-child(2) { animation-delay: 0.18s; }
    [data-state="processing"] .bar:nth-child(3) { animation-delay: 0.36s; }
    [data-state="processing"] .bar:nth-child(4) { animation-delay: 0.54s; }
    [data-state="processing"] .bar:nth-child(5) { animation-delay: 0.72s; }
    [data-state="processing"] .bar:nth-child(6) { animation-delay: 0.9s; }
    [data-state="processing"] .bar:nth-child(7) { animation-delay: 1.08s; }

    @keyframes metaxis-eqbar {
      0%, 100% { transform: scaleY(0.55); }
      50% { transform: scaleY(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      [data-state="processing"] .bar { animation: none; }
    }
  </style>

  <g transform="translate(42 64) scale(2)" aria-hidden="true">
    <g>
      <rect class="bar" x="0"  y="18.2" width="4" height="7.8"  rx="2"/>
      <rect class="bar" x="7"  y="6.5"  width="4" height="19.5" rx="2"/>
      <rect class="bar" x="14" y="14.3" width="4" height="11.7" rx="2"/>
      <rect class="bar" x="21" y="1.3"  width="4" height="24.7" rx="2"/>
      <rect class="bar" x="28" y="10.4" width="4" height="15.6" rx="2"/>
      <rect class="bar" x="35" y="3.9"  width="4" height="22.1" rx="2"/>
      <rect class="bar" x="42" y="15.6" width="4" height="10.4" rx="2"/>
    </g>
    <path d="M-4 23 L50 5"
          fill="none"
          stroke="#3ddff5"
          stroke-width="1"
          opacity="0.78"/>
  </g>

  <text x="166"
        y="116"
        fill="#e8e6dd"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="64"
        font-weight="700"
        letter-spacing="8.96">METAXIS</text>
</svg>
