[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yks-metaxis"
version = "0.1.0.dev0"
description = "Provider-neutral agentic harness and brain contract"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LittleYeti-Dev" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/LittleYeti-Dev/yks2.0-HF-METAXIS"

[project.scripts]
metaxis = "metaxis.cli:main"

[project.optional-dependencies]
huggingface = ["huggingface_hub==1.23.0"]
aws = ["boto3==1.43.47"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metaxis = ["capabilities/*.json", "capabilities/skills/*/*.md"]
