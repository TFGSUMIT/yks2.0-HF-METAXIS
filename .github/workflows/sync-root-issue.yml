name: sync-root-issue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: metaxis-root-issue-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mirror YKS Ops root issue 422 to METAXIS issue 1
        env:
          # Cross-repository token is required because YKS Ops is private.
          # The built-in token can write this repo but cannot read its authority.
          GH_TOKEN: ${{ secrets.YKS_OPS_SYNC_TOKEN }}
          METAXIS_SOURCE_REPO: LittleYeti-Dev/yks2.0-ops-hub
          METAXIS_SOURCE_ISSUE: "422"
          METAXIS_TARGET_REPO: LittleYeti-Dev/yks2.0-HF-METAXIS
          METAXIS_TARGET_ISSUE: "1"
        run: python scripts/sync_root_issue.py
