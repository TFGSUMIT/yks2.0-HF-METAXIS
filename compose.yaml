name: nemashells
services:
  metaxis:
    build:
      context: .
      args:
        METAXIS_REVISION: ${METAXIS_REVISION:-development}
    image: metaxis:${METAXIS_REVISION:-development}
    container_name: nemashells-metaxis
    restart: unless-stopped
    ports:
      - "127.0.0.1:4310:4310"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    environment:
      METAXIS_PROFILE: ${METAXIS_PROFILE:-orbstack-development}
      METAXIS_DATA_CLASSIFICATION: DEVELOPMENT
      METAXIS_EXTERNAL_MODEL_CALLS: "0"
      METAXIS_EXTERNAL_TELEMETRY: "0"
      METAXIS_OPERATOR_CADENCE: "5.6 sol"
      METAXIS_STATE_BACKEND: ${METAXIS_STATE_BACKEND:-memory}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      METAXIS_D1_DATABASE_ID: ${METAXIS_D1_DATABASE_ID:-}
      CLOUDFLARE_D1_API_TOKEN: ${CLOUDFLARE_D1_API_TOKEN:-}
      METAXIS_D1_TIMEOUT_SECONDS: ${METAXIS_D1_TIMEOUT_SECONDS:-10}
      METAXIS_D1_API_BASE: ${METAXIS_D1_API_BASE:-https://api.cloudflare.com/client/v4}
    networks:
      - default
      - metaxis_private
  lector:
    build:
      context: .
      dockerfile: deployment/lector/Dockerfile
      args:
        METAXIS_REVISION: ${METAXIS_REVISION:-development}
    image: metaxis-lector:${METAXIS_REVISION:-development}
    container_name: nemashells-lector
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    environment:
      LECTOR_HOST: 0.0.0.0
      LECTOR_PORT: 4320
    networks:
      - metaxis_private

networks:
  metaxis_private:
    internal: true
